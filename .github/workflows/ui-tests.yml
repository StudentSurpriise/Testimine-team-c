# Runs the Playwright UI tests on every push and pull request.
# Result: a green check (or red cross) next to the commit, and the HTML report as a downloadable artifact.
name: UI tests

on:
  push:
    branches: [main, ui-tests, ui-v2]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI tests (desktop + mobile)
        run: npx playwright test --project=ui --project=mobile

      - name: Upload HTML report
        if: always()                      # also when tests failed
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
